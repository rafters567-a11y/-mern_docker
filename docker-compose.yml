services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network

  server:
    build: ./server
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/movies
    depends_on:
      - mongo
    networks:
      - mern-network

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - mern-network

volumes:
  mongo-data:

networks:
  mern-network:
